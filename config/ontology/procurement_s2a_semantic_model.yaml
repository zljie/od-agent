        - dialect: ANSI_SQL
          expression: purchase_requests.delete_flag
      description: 删除标记
    - name: source_type
      type: String
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_requests.source_type
      description: 来源类型（system-系统接口集成/manual-手工创建/batch-批导）
      enum_values:
      - system
      - manual
      - batch
    - name: material_category
      type: String
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_requests.material_category
      description: 物料分类（办公用品/IT设备/生产物料等）
      enum_values:
      - office
      - production
      - it
      - engineering
      - furniture
      - labor
      - spare
      - packaging
      - other
    - name: execution_status
      type: String
      expression:
        description: 执行状态（由系统根据是否生成采购订单行项目自动计算）
      computed: true
      computation_logic:
        pending: 当 purchase_order_items 中不存在对应 pr_id/pr_item 时为未执行
        partial: 当采购订单行项目部分收货时为部分执行
        completed: 当采购订单行项目全部收货时为已完成
        cancelled: 当采购需求被撤销时为已取消
