version: "0.1.2"
semantic_model:
- name: procurement_s2a_assistant
  description: 采购助手 Source-to-Award 业务对象图谱，覆盖采购需求、询价、报价、比价、采购订单与收货执行闭环。
  ai_context:
    instructions: 默认口径：1) 删除标记 delete_flag=0 或为空的数据视为有效；2) 采购需求执行状态以采购需求行项目是否生成采购订单行项目判断；3) 有效报价需关联询价单，且价格有效期覆盖当前业务日期；4) 比价默认按同一物料、同一询价单下的供应商报价净价从低到高排序；5)
      采购订单执行进度以订单行项目的发货状态、已完成标识以及收货历史数量进行判断。
    synonyms:
    - 采购助手
    - 采购需求
    - 询价
    - 报价
    - 比价
    - 定标
    - 采购订单
    - S2A
    - Source-to-Award
    examples:
    - 帮我查还有哪些采购需求没有执行
    - 根据采购需求发起询价
    - 某个询价单现在有几家供应商报价了
    - 开始比价并推荐供应商
    - 根据审批通过的报价创建采购订单
    - 查询采购订单执行情况
  datasets:
  - name: purchase_requests
    source: erp.procurement.purchase_request
    primary_key:
    - pr_id
    - pr_item
    description: 采购需求行项目，表示业务部门提出的物料/服务采购需求。
    ai_context:
      synonyms:
      - 采购需求
      - 请购单
      - PR
      - Purchase Request
    fields:
    - name: pr_id
      type: String
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_requests.pr_id
      description: 采购需求编号
    - name: pr_item
      type: String
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_requests.pr_item
      description: 采购需求行项目
    - name: pr_type
      type: String
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_requests.pr_type
      description: 采购类型
    - name: material_id
      type: String
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_requests.material_id
      description: 物料编码
    - name: material_d
      type: String
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_requests.material_d
      description: 物料描述
    - name: delivery_date
      type: Date
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_requests.delivery_date
      description: 需求日期
      dimension:
        is_time: true
    - name: company_id
      type: String
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_requests.company_id
      description: 公司
    - name: factory_id
      type: String
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_requests.factory_id
      description: 工厂
    - name: quantity
      type: Number
      expression:
        dialects:
