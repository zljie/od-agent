          quotation_item: string
          reason: string
        output:
          workflow_id: string
          approval_status: string
      synonyms:
      - 定标审批
      - 中标审批
      labels:
      - business_action
    - id: procurement/create_purchase_order_from_pr_and_quotation
      name: 创建采购订单
      description: 基于审批通过的采购需求和有效报价创建采购订单。
      kind: command
      operation: create_purchase_order_from_pr_and_quotation
      entity_name: purchase_order_heads
      io_schema:
        input:
          pr_id: string
          pr_item: string
          quotation_id: string
          quotation_item: string
        output:
          po_id: string
          status: string
      synonyms:
      - 创建采购订单
      - 生成PO
      labels:
      - business_action
    - id: analytics/get_purchase_order_execution_status
      name: 查询采购订单执行情况
      description: 查询采购订单审批、发货、收货、发票等执行状态。
      kind: query
      operation: get_purchase_order_execution_status
      entity_name: purchase_order_items
      io_schema:
        input:
          po_id: string
        output:
          approval_status: string
          shipment_status: string
          receipt_status: string
          invoice_status: string
      synonyms:
      - 订单执行查询
      - 采购订单状态
      labels:
      - business_action
    rules:
    - id: rule/pr_approved_before_inquiry
      name: 采购需求审批后才允许询价
      description: 未审批或被驳回的采购需求不得生成询价单。
      severity: error
      when:
        action: procurement/create_inquiry_from_pr
      constraint:
        all_of:
        - field: purchase_requests.appro_whe
          operator: '='
          value: Y
        - field: purchase_requests.flow_status
          operator: IN
          value:
          - S0
          - APPROVED
        - field: purchase_requests.delete_flag
          operator: '='
          value: '0'
      message: 采购需求未审批通过或已删除，不能发起询价。
      remediation: 请先完成采购需求审批，或重新选择有效采购需求。
      labels:
      - governance
      - pr
    - id: rule/quotation_not_editable_after_po
      name: 已生成采购订单的报价不可撤销修改
      severity: error
      when:
        entity: purchase_quotations
        operation: update_or_cancel
      constraint:
        not_exists:
          dataset: purchase_order_items
          where: purchase_order_items.quotation_id = purchase_quotations.quotation_id AND purchase_order_items.quotation_item
            = purchase_quotations.quotation_item
      message: 该报价已被采购订单引用，不允许撤销或修改。
      remediation: 如确需调整，请走采购订单变更流程。
      labels:
      - quotation
      - po
    - id: rule/valid_price_comparison_requires_three_suppliers
      name: 有效比价至少需要三家供应商报价
      severity: warn
      when:
        action: analytics/generate_price_comparison
      constraint:
        metric: quotation_supplier_count
        operator: '>='
        value: 3
        group_by:
        - inquiry_id
        - material_id
      message: 参与报价供应商不足三家，比价结果仅供参考。
      remediation: 继续邀请供应商报价，或由采购负责人确认例外。
      labels:
      - price_comparison
    - id: rule/po_requires_effective_quotation
      name: 创建采购订单必须引用有效报价
      severity: error
      when:
        action: procurement/create_purchase_order_from_pr_and_quotation
      constraint:
        all_of:
        - field: purchase_quotations.status
          operator: IN
          value:
          - APPROVED
          - EFFECTIVE
          - S0
        - field: purchase_quotations.price_start_date
          operator: <=
          value: business_date
        - field: purchase_quotations.price_end_date
          operator: '>='
          value: business_date
      message: 未匹配到有效报价，不能自动创建采购订单。
      remediation: 请先完成报价审批，或重新选择价格有效期内的报价。
      labels:
      - po
      - quotation
    - id: rule/po_quantity_not_less_than_received
      name: 采购订单数量不得小于已收货数量
      severity: error
      when:
        entity: purchase_order_items
        operation: update_quantity
      constraint:
        field: purchase_order_items.quantity
        operator: '>='
        value: SUM(purchase_order_receipt_history.quantity)
      message: 修改后的采购订单数量不能小于累计已入库数量。
      remediation: 请调整为不小于已收货数量，或先处理退货/冲销。
      labels:
      - po
      - receipt
    - id: rule/deleted_records_excluded_by_default
      name: 默认排除删除标记记录
      severity: info
      when:
        query: '*'
      constraint:
        default_filter: delete_flag = 0 OR delete_flag IS NULL
      message: 默认分析口径会排除已删除业务单据。
      remediation: 如需审计删除数据，请显式指定包含删除标记。
      labels:
      - default_scope
