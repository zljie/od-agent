    - id: procurement/create_inquiry_from_pr
      name: 根据采购需求创建询价单
      description: 基于采购需求行项目创建询价单，并继承物料、数量、交期等信息。
      kind: command
      operation: create_inquiry_from_pr
      entity_name: purchase_inquiries
      io_schema:
