  - name: approval_workflows
    source: workflow.approval.workflow_instance
    primary_key:
    - workflow_id
    description: 审批工作流实例，记录采购相关审批流程的执行状态和历史。
    ai_context:
      synonyms:
      - 审批流程
      - 审批工作流
      - 工作流实例
    approval_status_values:
      description: 审批状态枚举值
      values:
        pending: 待审批 - 等待审批人处理
        approved: 已通过 - 审批人同意
        rejected: 已驳回 - 审批人拒绝
        withdrawn: 已撤回 - 申请人撤回申请
        expired: 已过期 - 审批超时
        cancelled: 已取消 - 流程被取消
    approval_action_values:
      description: 审批动作枚举值
      values:
        approve: 通过 - 同意申请
        reject: 驳回 - 拒绝申请
        transfer: 转交 - 转交给其他人审批
        comment: 评论 - 添加审批意见
        withdraw: 撤回 - 申请人撤回申请
