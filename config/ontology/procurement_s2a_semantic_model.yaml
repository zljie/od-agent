  - name: quotation_submitted_for_inquiry
    from: purchase_quotations
    to: purchase_inquiries
    from_columns:
    - inquiry_id
    - inquiry_item
    to_columns:
    - inquiry_id
    - inquiry_item
    ai_context:
      description: 报价单行项目响应某个询价单行项目
  - name: purchase_order_item_belongs_to_head
    from: purchase_order_items
    to: purchase_order_heads
    from_columns:
    - po_id
    to_columns:
    - po_id
    ai_context:
      description: 采购订单行项目属于采购订单抬头
  - name: purchase_order_item_fulfills_purchase_request
    from: purchase_order_items
    to: purchase_requests
    from_columns:
    - pr_id
    - pr_item
    to_columns:
    - pr_id
    - pr_item
    ai_context:
      description: 采购订单行项目执行某个采购需求行项目
  - name: purchase_order_item_uses_quotation
    from: purchase_order_items
    to: purchase_quotations
    from_columns:
    - quotation_id
    - quotation_item
    to_columns:
    - quotation_id
    - quotation_item
    ai_context:
      description: 采购订单行项目引用审批通过的报价行项目
  - name: receipt_history_records_purchase_order_item
    from: purchase_order_receipt_history
    to: purchase_order_items
    from_columns:
    - po_id
    - po_item
    to_columns:
    - po_id
    - po_item
    ai_context:
      description: 收货历史记录采购订单行项目的入库/退货执行
  metrics:
  - name: purchase_request_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(*)
    description: 采购需求行项目数量
  - name: approved_purchase_request_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(CASE WHEN purchase_requests.flow_status IN ('S0','APPROVED') THEN 1 ELSE 0 END)
    description: 已审批采购需求数量
  - name: unexecuted_purchase_request_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(CASE WHEN purchase_order_items.po_id IS NULL THEN 1 ELSE 0 END)
    description: 未生成采购订单的采购需求数量
  - name: purchase_request_execution_rate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(CASE WHEN purchase_order_items.po_id IS NOT NULL THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
    description: 采购需求执行率
  - name: inquiry_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT purchase_inquiries.inquiry_id)
    description: 询价单数量
  - name: quotation_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT purchase_quotations.quotation_id)
    description: 报价单数量
  - name: quotation_response_rate
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT purchase_quotations.quotation_id) / NULLIF(COUNT(DISTINCT purchase_inquiries.inquiry_id),
          0)
    description: 报价回收率
  - name: avg_quotation_net_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: AVG(purchase_quotations.net_price)
    description: 平均报价净价
  - name: lowest_quotation_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: MIN(purchase_quotations.net_price)
    description: 最低报价净价
  - name: purchase_order_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(purchase_order_heads.contract_amount)
    description: 采购订单总金额
  - name: received_quantity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(purchase_order_receipt_history.quantity)
    description: 累计收货数量
