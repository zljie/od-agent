          approver_name: string
      synonyms:
      - 审批状态查询
      - 工作流查询
      labels:
      - workflow
    - id: approval/query_workflow_history
      name: 查询审批历史
      description: 查询审批流程的完整历史记录。
      kind: query
      operation: query_workflow_history
      entity_name: approval_history
      io_schema:
        input:
          workflow_id: string
        output:
          history_records: array
          summary: object
      synonyms:
      - 审批记录查询
      - 审批历史查询
      labels:
      - workflow
    - id: approval/submit_for_approval
      name: 提交审批申请
      description: 将业务单据提交到审批工作流。
      kind: command
      operation: submit_for_approval
      entity_name: approval_workflows
      io_schema:
        input:
          related_document_type: string
          related_document_id: string
          workflow_type: string
          reason: string
        output:
          workflow_id: string
          status: string
      synonyms:
      - 发起审批
      - 提交审批
      labels:
      - workflow
      confirmation_required: true
    - id: approval/approve_workflow
      name: 审批通过
      description: 审批人批准当前审批步骤。
      kind: command
      operation: approve_workflow
      entity_name: approval_history
      io_schema:
        input:
          workflow_id: string
          comment: string
        output:
          status: string
          next_step: integer
      synonyms:
      - 审批通过
      - 同意
      - 批准
      labels:
      - workflow
      confirmation_required: true
    - id: approval/reject_workflow
      name: 审批驳回
      description: 审批人驳回当前审批步骤。
      kind: command
      operation: reject_workflow
      entity_name: approval_history
      io_schema:
        input:
          workflow_id: string
          reason: string
        output:
          status: string
      synonyms:
      - 审批驳回
      - 拒绝
      - 不同意
      labels:
      - workflow
      confirmation_required: true
    - id: approval/withdraw_workflow
      name: 撤回审批申请
      description: 申请人撤回待审批的申请。
      kind: command
      operation: withdraw_workflow
      entity_name: approval_workflows
      io_schema:
        input:
          workflow_id: string
        output:
          status: string
      synonyms:
      - 撤回申请
      - 取消审批
      labels:
      - workflow
      confirmation_required: true
    - id: inquiry/publish_inquiry
      name: 发布询价单
      description: 将询价单发布给邀请的供应商。
      kind: command
      operation: publish_inquiry
      entity_name: purchase_inquiries
      io_schema:
        input:
          inquiry_id: string
          supplier_scope: array
        output:
          inquiry_id: string
          publish_status: string
      synonyms:
      - 发布询价
      - 发送给供应商
      labels:
      - rfq
      confirmation_required: true
    - id: inquiry/withdraw_inquiry
      name: 撤回询价单
      description: 撤回已发布但尚未收到报价的询价单。
      kind: command
      operation: withdraw_inquiry
      entity_name: purchase_inquiries
      io_schema:
        input:
          inquiry_id: string
          reason: string
        output:
          inquiry_id: string
          publish_status: string
      synonyms:
      - 撤回询价
      - 取消询价
      labels:
      - rfq
      confirmation_required: true
    - id: inquiry/close_inquiry
      name: 关闭询价单
      description: 关闭询价单，结束询价流程。
      kind: command
      operation: close_inquiry
      entity_name: purchase_inquiries
      io_schema:
        input:
          inquiry_id: string
          reason: string
        output:
          inquiry_id: string
          status: string
      synonyms:
      - 关闭询价
      - 结束询价
      labels:
      - rfq
      confirmation_required: true
    - id: quotation/remind_supplier
      name: 催办供应商报价
      description: 向尚未报价的供应商发送报价提醒。
      kind: command
      operation: remind_supplier
      entity_name: purchase_inquiries
      io_schema:
        input:
          inquiry_id: string
          vendor_ids: array
        output:
          reminder_sent: integer
      synonyms:
      - 催报价
      - 提醒供应商
      labels:
      - rfq
    rules:
    - id: rule/pr_approved_before_inquiry
      name: 采购需求审批后才允许询价
      description: 未审批或被驳回的采购需求不得生成询价单。
      severity: error
      when:
        action: procurement/create_inquiry_from_pr
      constraint:
        all_of:
        - field: purchase_requests.appro_whe
          operator: '='
          value: Y
        - field: purchase_requests.flow_status
          operator: IN
          value:
          - S0
          - APPROVED
        - field: purchase_requests.delete_flag
          operator: '='
          value: '0'
      message: 采购需求未审批通过或已删除，不能发起询价。
      remediation: 请先完成采购需求审批，或重新选择有效采购需求。
      labels:
      - governance
      - pr
    - id: rule/quotation_not_editable_after_po
      name: 已生成采购订单的报价不可撤销修改
      severity: error
      when:
        entity: purchase_quotations
        operation: update_or_cancel
      constraint:
        not_exists:
          dataset: purchase_order_items
          where: purchase_order_items.quotation_id = purchase_quotations.quotation_id AND purchase_order_items.quotation_item
            = purchase_quotations.quotation_item
      message: 该报价已被采购订单引用，不允许撤销或修改。
      remediation: 如确需调整，请走采购订单变更流程。
      labels:
      - quotation
      - po
    - id: rule/valid_price_comparison_requires_three_suppliers
      name: 有效比价至少需要三家供应商报价
      severity: warn
      when:
        action: analytics/generate_price_comparison
      constraint:
        metric: quotation_supplier_count
        operator: '>='
        value: 3
        group_by:
        - inquiry_id
        - material_id
      message: 参与报价供应商不足三家，比价结果仅供参考。
      remediation: 继续邀请供应商报价，或由采购负责人确认例外。
      labels:
      - price_comparison
    - id: rule/po_requires_effective_quotation
      name: 创建采购订单必须引用有效报价
      severity: error
      when:
        action: procurement/create_purchase_order_from_pr_and_quotation
      constraint:
        all_of:
        - field: purchase_quotations.status
          operator: IN
          value:
          - APPROVED
          - EFFECTIVE
          - S0
        - field: purchase_quotations.price_start_date
          operator: <=
          value: business_date
        - field: purchase_quotations.price_end_date
          operator: '>='
          value: business_date
      message: 未匹配到有效报价，不能自动创建采购订单。
      remediation: 请先完成报价审批，或重新选择价格有效期内的报价。
      labels:
      - po
      - quotation
    - id: rule/po_quantity_not_less_than_received
      name: 采购订单数量不得小于已收货数量
      severity: error
      when:
        entity: purchase_order_items
        operation: update_quantity
      constraint:
        field: purchase_order_items.quantity
        operator: '>='
        value: SUM(purchase_order_receipt_history.quantity)
      message: 修改后的采购订单数量不能小于累计已入库数量。
      remediation: 请调整为不小于已收货数量，或先处理退货/冲销。
      labels:
      - po
      - receipt
    - id: rule/pr_not_deletable_after_approved
      name: 已审批采购需求不可删除
      description: 已审批通过的采购需求不得删除，防止业务风险。
      severity: error
      when:
        entity: purchase_requests
        operation: delete
      constraint:
        any_of:
        - field: purchase_requests.flow_status
          operator: IN
          value:
          - S0
          - APPROVED
      message: 该采购需求已审批通过，不能删除。
      remediation: 如需作废，请先撤销审批流程。
      labels:
      - governance
      - pr
    - id: rule/pr_approval_not_revocable_after_po
      name: 已生成采购订单的采购需求审批不可撤销
      description: 采购需求已生成采购订单后，审批状态不可撤销。
      severity: error
      when:
        entity: purchase_requests
        operation: revoke_approval
      constraint:
        not_exists:
          dataset: purchase_order_items
          where: purchase_order_items.pr_id = purchase_requests.pr_id AND purchase_order_items.pr_item = purchase_requests.pr_item
      message: 该采购需求已生成采购订单，不能撤销审批。
      remediation: 如需调整，请通过采购订单变更流程处理。
      labels:
      - governance
      - pr
      - po
    - id: rule/inquiry_not_deletable_after_published
      name: 已发布询价单不可删除
      description: 已发布给供应商的询价单不得删除，防止业务中断。
      severity: error
      when:
        entity: purchase_inquiries
        operation: delete
      constraint:
        field: purchase_inquiries.publish_status
        operator: '!='
        value: published
      message: 该询价单已发布给供应商，不能直接删除。
      remediation: 请先撤回询价发布，再进行删除操作。
      labels:
      - rfq
      - inquiry
    - id: rule/inquiry_not_withdrawable_after_quotation
      name: 已收到报价的询价单不可撤回
      description: 询价单已有供应商报价后不可撤回。
      severity: error
      when:
        entity: purchase_inquiries
        operation: withdraw
      constraint:
        not_exists:
          dataset: purchase_quotations
          where: purchase_quotations.inquiry_id = purchase_inquiries.inquiry_id AND purchase_quotations.inquiry_item = purchase_inquiries.inquiry_item
      message: 该询价单已有供应商报价，不能撤回。
      remediation: 如需终止询价，请关闭询价单而非撤回。
      labels:
      - rfq
      - inquiry
    - id: rule/quotation_not_modifiable_after_locked
      name: 已锁定报价不可修改
      description: 报价单被锁定后不可修改。
      severity: error
      when:
        entity: purchase_quotations
        operation: update
      constraint:
        field: purchase_quotations.lock_status
        operator: '!='
        value: locked
      message: 该报价单已被锁定，不能修改。
      remediation: 如需修改，请联系管理员解锁。
      labels:
      - quotation
    - id: rule/quotation_not_modifiable_after_expired
      name: 已过期报价不可修改
      description: 价格有效期已过的报价单不可修改。
      severity: error
      when:
        entity: purchase_quotations
        operation: update
      constraint:
        field: purchase_quotations.price_end_date
        operator: '>='
        value: business_date
      message: 该报价单价格有效期已过，不能修改。
      remediation: 请发起新的询价流程。
      labels:
      - quotation
    - id: rule/quotation_not_modifiable_after_po_created
      name: 已生成采购订单的报价不可修改
      description: 报价单已被采购订单引用后不可修改。
      severity: error
      when:
        entity: purchase_quotations
        operation: update
      constraint:
        not_exists:
          dataset: purchase_order_items
          where: purchase_order_items.quotation_id = purchase_quotations.quotation_id AND purchase_order_items.quotation_item = purchase_quotations.quotation_item
      message: 该报价单已被采购订单引用，不能修改。
      remediation: 如需调整，请通过采购订单变更流程处理。
      labels:
      - quotation
      - po
    - id: rule/approval_submit_requires_valid_recommendation
      name: 提交审批需要有效的推荐报价
      description: 提交中标审批前必须确认推荐报价通过所有规则校验。
      severity: error
      when:
        action: procurement/submit_award_approval
      constraint:
        all_of:
        - metric: quotation_supplier_count
          operator: '>='
          value: 1
        - field: purchase_quotations.status
          operator: IN
          value:
          - DRAFT
          - SUBMITTED
      message: 推荐报价未通过规则校验，不能提交审批。
      remediation: 请先完成比价分析，确认推荐报价符合规则。
      labels:
      - approval
      - quotation
    - id: rule/deleted_records_excluded_by_default
      name: 默认排除删除标记记录
      severity: info
      when:
        query: '*'
      constraint:
        default_filter: delete_flag = 0 OR delete_flag IS NULL
      message: 默认分析口径会排除已删除业务单据。
      remediation: 如需审计删除数据，请显式指定包含删除标记。
      labels:
      - default_scope
