<!-- Prompt 配置 -->
<div class="config-card" x-data="promptSection()">
    <div class="config-card-header">
        <h3>Prompt 配置</h3>
        <!-- 开发模式指示器 -->
        <div x-show="isDevMode" style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="badge badge-draft">研发模式</span>
            <span style="font-size: 0.7rem; color: #9ca3af;">保存即生效</span>
        </div>
    </div>

    <div class="config-section">
        <div class="config-section-title">System Prompt</div>
        <div>
            <label for="systemPrompt">System Prompt</label>
            <textarea id="systemPrompt"
                      x-model="form.system_prompt"
                      placeholder="Enter system prompt..."
                      rows="10"></textarea>
            <p class="field-hint">定义 Agent 的核心角色、行为准则和回复风格</p>
        </div>

        <div style="margin-top: 0.75rem;">
            <button type="button" class="btn btn-outline btn-sm" @click="showPreview = !showPreview">
                <span x-text="showPreview ? '收起预览' : '预览 Prompt'"></span>
            </button>
        </div>

        <div x-show="showPreview" style="margin-top: 0.75rem;">
            <div class="schema-area" x-text="form.system_prompt || '（无内容）'"></div>
        </div>
    </div>

    <hr class="section-divider">

    <div class="config-section">
        <div class="form-grid-2">
            <div>
                <label for="roleDefinition">Role Definition</label>
                <textarea id="roleDefinition" x-model="form.role_definition" rows="3"
                          placeholder="定义 Agent 的具体角色定位..."></textarea>
            </div>
            <div>
                <label for="fallbackReply">Fallback Reply</label>
                <textarea id="fallbackReply" x-model="form.fallback_reply" rows="3"
                          placeholder="无法回答时的兜底回复..."></textarea>
            </div>
        </div>

        <div class="form-grid-2" style="margin-top: 1rem;">
            <div>
                <label for="responseStyle">Reply Style</label>
                <select id="responseStyle" x-model="form.response_style">
                    <option value="professional">Professional 专业</option>
                    <option value="friendly">Friendly 友好</option>
                    <option value="concise">Concise 简洁</option>
                    <option value="detailed">Detailed 详细</option>
                    <option value="empathetic">Empathetic 同理心</option>
                </select>
            </div>
            <div>
                <label for="outputFormat">Output Format</label>
                <select id="outputFormat" x-model="form.output_format">
                    <option value="markdown">Markdown</option>
                    <option value="plain">Plain Text</option>
                    <option value="json">JSON</option>
                    <option value="html">HTML</option>
                </select>
            </div>
        </div>
    </div>

    <hr class="section-divider">

    <div class="config-section">
        <div class="config-section-title">Safety &amp; Compliance</div>
        <div>
            <label for="safetyInstructions">Safety Instructions</label>
            <textarea id="safetyInstructions" x-model="form.safety_instructions"
                      rows="4"
                      placeholder="安全与合规要求，例如：禁止回复涉及政治敏感话题..."></textarea>
            <p class="field-hint">定义 Agent 必须遵守的安全边界和合规要求</p>
        </div>
    </div>

    <!-- 保存结果提示 -->
    <div x-show="saveMessage" style="margin-top: 1rem;" :class="'toast toast-' + saveResultType">
        <span x-text="saveMessage"></span>
    </div>
</div>

<script>
// Make promptSection globally available
function promptSection() {
    return {
        showPreview: false,
        isDevMode: true, // 研发模式下默认热更新
        saveMessage: null,
        saveResultType: 'success',
        form: {
            system_prompt: '',
            role_definition: '',
            fallback_reply: '',
            response_style: 'professional',
            output_format: 'markdown',
            safety_instructions: '',
        },
        init() {
            this.loadConfig();
            // Listen for save events from bottom action bar
            const panel = document.getElementById('main-panel');
            if (panel) {
                panel.addEventListener('section-save', () => {
                    this.saveConfig();
                });
            }
        },
        async loadConfig() {
            try {
                const resp = await fetch('/config');
                const data = await resp.json();
                this.form.system_prompt = data.system_prompt || '';
                // 始终启用热更新直到正式发布
                this.isDevMode = true;
            } catch(e) {
                console.error('Failed to load config:', e);
            }
        },
        async saveConfig() {
            this.saveMessage = null;
            try {
                const resp = await fetch('/admin/agents/1/prompt', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(this.form),
                });
                const data = await resp.json();
                
                this.saveMessage = data.message || '保存成功';
                this.saveResultType = data.status === 'success' ? 'success' : 'error';
                
                if (data.hot_reload) {
                    this.showToastToParent('Agent 已热更新，新配置立即生效', 'success');
                } else {
                    this.showToastToParent('配置已保存', 'success');
                }
                
                setTimeout(() => {
                    this.saveMessage = null;
                }, 3000);
            } catch(e) {
                this.saveMessage = '保存失败: ' + e.message;
                this.saveResultType = 'error';
            }
        },
        showToastToParent(message, type) {
            const ws = document.querySelector('[x-data]');
            if (ws && ws.__x && ws.__x.$data && typeof ws.__x.$data.showToast === 'function') {
                ws.__x.$data.showToast(message, type);
            }
        },
    };
}
</script>
